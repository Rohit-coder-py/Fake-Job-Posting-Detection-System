<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-label="Fraud risk gauge example: 74.5 percent">
  <rect width="600" height="360" rx="22" fill="#0b0e14"/>
  <text x="300" y="42" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="22" font-weight="800" fill="#c7d2fe">Fraud-risk meter  (example posting)</text>
  <g stroke-linecap="butt"><path d="M130.0 250.0 A170 170 0 0 1 220.5 99.8" fill="none" stroke="#2fd4a0" stroke-width="30"/><path d="M225.2 97.3 A170 170 0 0 1 374.8 97.3" fill="none" stroke="#ffb454" stroke-width="30"/><path d="M379.5 99.8 A170 170 0 0 1 470.0 250.0" fill="none" stroke="#ff5b6e" stroke-width="30"/></g>
  <text x="130" y="278" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#aab3c9">0</text>
  <text x="470" y="278" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#aab3c9">100</text>
  <g>
    <line x1="300" y1="250" x2="300" y2="105" stroke="#f1f4fb" stroke-width="5" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="rotate" dur="7s" repeatCount="indefinite" values="-90 300 250;-90 300 250;58.1 300 250;38.1 300 250;44.1 300 250;44.1 300 250;-90 300 250" keyTimes="0;0.08;0.22;0.3;0.38;0.88;1"/>
  </g>
  <circle cx="300" cy="250" r="12" fill="#f1f4fb"/>
  <text x="300" y="312" text-anchor="middle" font-family="'Courier New', monospace" font-size="34" font-weight="700" fill="#ff5b6e">74.5%
    <animate attributeName="opacity" values="0.15;0.15;1;1;0.15" keyTimes="0;0.2;0.38;0.88;1" dur="7s" repeatCount="indefinite"/></text>
  <text x="300" y="336" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="14" fill="#aab3c9" letter-spacing="2">HIGH RISK · FRAUDULENT JOB POSTING</text>
