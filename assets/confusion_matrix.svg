<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="Confusion matrix of the Random Forest model">
  <rect width="720" height="400" rx="22" fill="#131824"/>
  <text x="360" y="42" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="24" font-weight="800" fill="#e2e8f0">Confusion matrix - Random Forest (3,576 test postings)</text>
  <text x="410" y="92" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="14" fill="#94a3b8" letter-spacing="2">PREDICTED:   GENUINE  |  FRAUD</text>
  <text transform="translate(110,250) rotate(-90)" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="14" fill="#94a3b8" letter-spacing="2">ACTUAL:  GENUINE | FRAUD</text>
  <g transform="translate(150,110)">
    <rect width="250" height="115" rx="18" fill="#2fd4a0" opacity="0.16"/>
    <rect width="250" height="115" rx="18" fill="none" stroke="#2fd4a0" stroke-width="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.0s" repeatCount="indefinite"/></rect>
    <text x="125" y="26" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="12" font-weight="700" fill="#2fd4a0" letter-spacing="2">TRUE NEGATIVE</text>
    <text x="125" y="72" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="42" font-weight="800" fill="#f8fafc">3,403
      <animateTransform attributeName="transform" type="scale" values="1;1.06;1" dur="3s" begin="0.0s" repeatCount="indefinite" additive="sum"/></text>
    <text x="125" y="98" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="13" fill="#cbd5e1">Genuine jobs correctly passed</text>
  </g>
  <g transform="translate(420,110)">
    <rect width="250" height="115" rx="18" fill="#64748b" opacity="0.16"/>
    <rect width="250" height="115" rx="18" fill="none" stroke="#64748b" stroke-width="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.6s" repeatCount="indefinite"/></rect>
    <text x="125" y="26" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="12" font-weight="700" fill="#64748b" letter-spacing="2">FALSE POSITIVE</text>
    <text x="125" y="72" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="42" font-weight="800" fill="#f8fafc">0
      <animateTransform attributeName="transform" type="scale" values="1;1.06;1" dur="3s" begin="0.6s" repeatCount="indefinite" additive="sum"/></text>
    <text x="125" y="98" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="13" fill="#cbd5e1">Genuine jobs wrongly flagged</text>
  </g>
  <g transform="translate(150,240)">
    <rect width="250" height="115" rx="18" fill="#ff5b6e" opacity="0.16"/>
    <rect width="250" height="115" rx="18" fill="none" stroke="#ff5b6e" stroke-width="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.2s" repeatCount="indefinite"/></rect>
    <text x="125" y="26" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="12" font-weight="700" fill="#ff5b6e" letter-spacing="2">FALSE NEGATIVE</text>
    <text x="125" y="72" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="42" font-weight="800" fill="#f8fafc">70
      <animateTransform attributeName="transform" type="scale" values="1;1.06;1" dur="3s" begin="1.2s" repeatCount="indefinite" additive="sum"/></text>
    <text x="125" y="98" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="13" fill="#cbd5e1">Scams the model missed</text>
  </g>
  <g transform="translate(420,240)">
    <rect width="250" height="115" rx="18" fill="#d9b45a" opacity="0.16"/>
    <rect width="250" height="115" rx="18" fill="none" stroke="#d9b45a" stroke-width="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.7999999999999998s" repeatCount="indefinite"/></rect>
    <text x="125" y="26" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="12" font-weight="700" fill="#d9b45a" letter-spacing="2">TRUE POSITIVE</text>
    <text x="125" y="72" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="42" font-weight="800" fill="#f8fafc">103
      <animateTransform attributeName="transform" type="scale" values="1;1.06;1" dur="3s" begin="1.7999999999999998s" repeatCount="indefinite" additive="sum"/></text>
    <text x="125" y="98" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="13" fill="#cbd5e1">Scams correctly caught</text>
  </g>
  <text x="360" y="378" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="14" fill="#94a3b8">Perfect precision - but 70 of 173 scams slip through (recall 59.5%)</text>
</svg>