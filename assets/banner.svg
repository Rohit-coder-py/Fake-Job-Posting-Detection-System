    <animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="3.2s" begin="1.3s" repeatCount="indefinite"/></text>
  <text x="705" y="55" font-size="38" text-anchor="middle" opacity="0.92">⚠️
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="3.2s" begin="0.4s" repeatCount="indefinite"/></text>
