    <animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="3.2s" begin="1.0s" repeatCount="indefinite"/></text>
  <text x="915" y="90" font-size="38" text-anchor="middle" opacity="0.92">📧
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="3.2s" begin="1.6s" repeatCount="indefinite"/></text>
  <text x="62" y="205" font-size="38" text-anchor="middle" opacity="0.92">🛡️
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="3.2s" begin="1.9s" repeatCount="indefinite"/></text>
  <text x="935" y="205" font-size="38" text-anchor="middle" opacity="0.92">💸
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="3.2s" begin="0.2s" repeatCount="indefinite"/></text>
  <text x="500" y="118" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#title)">Fake Job Posting Detection System</text>
  <clipPath id="c0"><rect x="275.6" y="150" height="40" width="0">
    <animate attributeName="width" dur="12.0s" repeatCount="indefinite" values="0.0;0.0;448.8;448.8;0.0;0.0" keyTimes="0.0000;0.0000;0.1500;0.2917;0.3167;1.0000"/></rect></clipPath>
  <text x="275.6" y="178" font-family="'Courier New', monospace" font-size="22" fill="#c7d2fe" clip-path="url(#c0)">Spot scam job ads before you apply</text>
  <clipPath id="c1"><rect x="156.8" y="150" height="40" width="0">
    <animate attributeName="width" dur="12.0s" repeatCount="indefinite" values="0.0;0.0;686.4;686.4;0.0;0.0" keyTimes="0.0000;0.3333;0.4833;0.6250;0.6500;1.0000"/></rect></clipPath>
  <text x="156.8" y="178" font-family="'Courier New', monospace" font-size="22" fill="#c7d2fe" clip-path="url(#c1)">Random Forest  |  98.04% accuracy  |  100% precision</text>
  <clipPath id="c2"><rect x="143.6" y="150" height="40" width="0">
