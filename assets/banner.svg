<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Fake Job Posting Detection System banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#2a1530"><animate attributeName="stop-color" values="#2a1530;#1a2140;#2a1530" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9b45a"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5b6e" stop-opacity="0"/><stop offset="1" stop-color="#ff5b6e" stop-opacity="0.35"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1000" height="300" rx="24"/></clipPath>
  </defs>
  <rect width="1000" height="300" rx="24" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <circle cx="140" cy="150" r="90" fill="#5b8cff" opacity="0.10"><animate attributeName="r" values="80;110;80" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="170" r="100" fill="#ff5b6e" opacity="0.10"><animate attributeName="r" values="100;75;100" dur="7s" repeatCount="indefinite"/></circle>
    <rect width="1000" height="60" fill="url(#scan)"><animate attributeName="y" values="-60;300" dur="4.5s" repeatCount="indefinite"/></rect>
  </g>
  <text x="85" y="75" font-size="38" text-anchor="middle" opacity="0.92">🚨
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="3.2s" begin="0s" repeatCount="indefinite"/></text>
