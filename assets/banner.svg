  <text x="500" y="262" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="15" fill="#aab3c9" letter-spacing="3">SCIKIT-LEARN  ·  FASTAPI  ·  STREAMLIT</text>
